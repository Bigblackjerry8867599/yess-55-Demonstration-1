<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellyyork | Country Club</title>
    <meta name="description" content="Hellyyork is a private country club offering golf, tennis, dining, wellness and family club life for members and their guests.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Marcellus&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3e362e;
            --secondary: #000000;
            --dark: #3e362e;
            --light: #000000;
            --accent: #ffd166;
            --text: #333333;
            --other: #fffdd0;
            --some: #ffffff;
            --card-bg: #1a1a1a;
            --dark-amethyst: #32174d;
            --brand-forest: #081849;
            --font-display: 'Marcellus', 'Playfair Display', Georgia, serif;
            --font-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --card-w: 260px;
            --card-h: 340px;
            --ring-radius: 300px;
            --ring-stage-pad: 94px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, h1, h2, h3, h4, h5, h6, p, a, li, span, small, b, strong, label, button, .btn, .hero-text, .hero-paragraph, .headline-right, .section-title h2, .rot-card-body h3, .rot-card-body p, .service-content h3, .service-content p, .step-card h3, .step-card p, .advantage-card h3, .advantage-card p, .cta h2, .cta p, footer h3, footer p, footer li, footer a, .color-picker .label {
            font-style: italic !important;
        }
        body {
            font-family: var(--font-body);
            color: #ffffff;
            background-color: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
            margin: 0;
            padding-top: 0 !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }
        h1, h2, h3 { text-wrap: balance; }
        ::selection { background: var(--accent); color: var(--brand-forest); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
        nav {
            position: sticky; top: 0; background: var(--brand-forest); z-index: 1000;
            border-bottom: none; padding: 0; height: 22px; display: flex; align-items: center;
            font-family: var(--font-body); overflow: visible; transition: background-color 0.3s ease;
        }
        .container { width: 90%; max-width: 1200px; margin: 0 auto; }
        .nav-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1rem; display: flex; align-items: center; justify-content: flex-end; height: 100%; }
        #menu-toggle { display: none; margin-left: 0.5rem; margin-right: 0; font-size: 0.9rem; line-height: 1; background: transparent; border: none; cursor: pointer; color: #fff; transition: color 0.3s ease; }
        #nav-links { list-style: none; display: flex; align-items: center; gap: 1rem; margin: 0; padding: 0; }
        #nav-links a { text-decoration: none; color: #fff; font-family: var(--font-body); font-weight: 600; font-size: 0.95rem; line-height: 1; display: block; letter-spacing: 0.04em; transition: color 0.3s ease; }
        #nav-links a:hover { color: var(--accent); }
        #nav-links .nav-cta { background-color: var(--accent); color: var(--primary); padding: 0.15rem 0.7rem; border-radius: 4px; font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; }
        #nav-links.open { display: flex; flex-direction: column; align-items: flex-start; position: absolute; top: 22px; right: 1rem; left: auto; padding: 1rem; background: var(--brand-forest); box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); border-radius: 5px; gap: 1rem; z-index: 999; text-align: left; }
        .btn { display: inline-block; padding: 12px 28px; border-radius: 30px; text-decoration: none; font-family: var(--font-body); font-weight: 700; transition: all 0.3s ease; cursor: pointer; border: none; font-size: 17px; letter-spacing: 0.04em; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--light); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4); }
        .btn-secondary { background-color: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-secondary:hover { background-color: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4); }
        /* ===== NEW HERO - IMAGE ONLY ===== */
        section.hero { position: relative; padding: 0 !important; margin: 0 !important; background: #000; overflow: hidden; line-height: 0; }
        .hero-new-image { width: 100%; height: auto; display: block; object-fit: cover; }
        html.light-mode #nav-links a { color: #1a1a1a; }
        html.light-mode #nav-links a:hover { color: #003262; }
        html.light-mode #menu-toggle { color: #1a1a1a; }
        html.light-mode #nav-links.open { background: #ffffff; border: 1px solid rgba(0,0,0,0.1); }
        @media (max-width: 768px) {
            #menu-toggle { display: block; } #nav-links { display: none; } .container { flex-direction: column-reverse; }
        }
        .rotating-cards { position: relative; padding: 0 0 60px; background: radial-gradient(circle at 50% 0%, rgba(74, 124, 63, 0.35) 0%, transparent 60%), #000000; overflow: hidden; border-radius: 40px 40px 0 0; }
        .ring-stage { position: relative; height: calc(var(--card-h) + var(--ring-stage-pad)); display: flex; align-items: center; justify-content: center; perspective: 1400px; perspective-origin: 50% 50%; }
        .ring-stage::before { content: ''; position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 620px; max-width: 90vw; height: 100px; background: radial-gradient(ellipse at center, rgba(255, 209, 102, 0.22), transparent 70%); filter: blur(14px); pointer-events: none; z-index: 0; }
        .card-ring { position: relative; width: var(--card-w); height: var(--card-h); transform-style: preserve-3d; transform: rotateY(0deg); animation: ringSpin 26s linear infinite; will-change: transform; z-index: 1; }
        .ring-stage:hover .card-ring, .ring-stage:focus-within .card-ring { animation-play-state: paused; }
        @keyframes ringSpin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .rot-card { position: absolute; top: 0; left: 0; width: var(--card-w); height: var(--card-h); display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: #10261a; border: 1px solid rgba(255, 209, 102, 0.28); box-shadow: 0 22px 45px rgba(0, 0, 0, 0.6); backface-visibility: hidden; -webkit-backface-visibility: hidden; transform: rotateY(calc(var(--i) * 60deg)) translateZ(var(--ring-radius)); transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        .rot-card img { width: 100%; height: 58%; object-fit: cover; display: block; flex: 0 0 58%; filter: saturate(1.05); }
        .rot-card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .rot-card-body h3 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 400; letter-spacing: 0.02em; line-height: 1.15; color: var(--accent); }
        .rot-card-body p { font-family: var(--font-body); font-size: 0.95rem; line-height: 1.55; color: #d4dccf; }
